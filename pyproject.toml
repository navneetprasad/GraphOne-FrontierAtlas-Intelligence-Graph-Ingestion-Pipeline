[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frontieratlas-pipeline"
version = "1.0.0"
description = "Production-grade, fault-tolerant, asynchronous data ingestion and LLM extraction pipeline for the GraphOne / FrontierAtlas Intelligence Graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "rapidfuzz>=3.8.0",
    "python-dateutil>=2.9.0",
    "tenacity>=8.3.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "reportlab>=4.2.0",
    "google-genai>=0.1.0",
    "gspread>=6.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
